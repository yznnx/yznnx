# Publishes the TuneGuess app (tune-guess/) to GitHub Pages whenever it changes on main.
# One-time: GitHub → repository Settings → Pages → "Build and deployment" → Source: "GitHub Actions".
name: Deploy TuneGuess

on:
  push:
    branches: [main]
    paths: ['tune-guess/**', '.github/workflows/deploy-tune-guess.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tune-guess
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tune-guess/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tune-guess/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
